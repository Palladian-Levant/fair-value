name: Update site

on:
  schedule:
    # 22:47 UTC, Monday to Friday, after the US market closes.
    - cron: '47 22 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: Companies to check. Leave blank for a full run.
        required: false
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/site.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Value companies
        if: github.event_name != 'push'
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCREEN_LIMIT: ${{ inputs.limit }}
        run: node scripts/build-screener.mjs

      - name: Save results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update screener results"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
